name: Update README Stats Cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate stats cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=AndresPinzon14&show_icons=true&theme=github_dark&hide_border=true&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=AndresPinzon14&layout=compact&langs_count=8&theme=github_dark&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - Satori MMA Frontend
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Satori-MMA&repo=Frontend&theme=github_dark&hide_border=true
          path: profile/pin-satori-frontend.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - Satori MMA Backend
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Satori-MMA&repo=Backend&theme=github_dark&hide_border=true
          path: profile/pin-satori-backend.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - Notera Front
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Notera-App&repo=Front&theme=github_dark&hide_border=true
          path: profile/pin-notera-front.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - Delivery Food
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=MyUnicaucaGit&repo=DeliveryFood&theme=github_dark&hide_border=true
          path: profile/pin-unicauca-deliveryfood.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update stats cards" || exit 0
          git push
